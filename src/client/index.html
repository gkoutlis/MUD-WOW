<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MUD-WoW · Teldrassil</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== Decorative background layers ===== -->
    <div class="bg-mist"></div>
    <div class="bg-runes"></div>
    <div class="particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- ===== Main frame ===== -->
    <div class="frame">
        <!-- Top emblem -->
        <header class="topbar">
            <div class="emblem">
                <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
                    <defs>
                        <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#a8d8b9"/>
                            <stop offset="100%" stop-color="#3a7a4f"/>
                        </linearGradient>
                    </defs>
                    <path d="M32 4 C18 18, 14 36, 32 60 C50 36, 46 18, 32 4 Z" fill="url(#leafGrad)" stroke="#c9b074" stroke-width="1.5"/>
                    <path d="M32 12 L32 56" stroke="#1a3a25" stroke-width="0.8" opacity="0.6"/>
                    <path d="M32 24 Q24 28, 22 36" stroke="#1a3a25" stroke-width="0.6" fill="none" opacity="0.5"/>
                    <path d="M32 24 Q40 28, 42 36" stroke="#1a3a25" stroke-width="0.6" fill="none" opacity="0.5"/>
                    <path d="M32 38 Q26 42, 25 48" stroke="#1a3a25" stroke-width="0.6" fill="none" opacity="0.5"/>
                    <path d="M32 38 Q38 42, 39 48" stroke="#1a3a25" stroke-width="0.6" fill="none" opacity="0.5"/>
                </svg>
            </div>
            <div class="title-block">
                <h1>MUD · Teldrassil</h1>
                <p class="subtitle">A realm woven from ancient roots</p>
            </div>
            <div id="status" class="status disconnected">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>
        </header>

        <div class="main-grid">
            <!-- ===== Left sidebar (mock for now) ===== -->
            <aside class="sidebar">
                <div class="panel character-panel">
                    <div class="panel-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2 L14 9 L21 9 L15 13 L17 20 L12 16 L7 20 L9 13 L3 9 L10 9 Z" fill="#d9c074" stroke="#5a4a1f" stroke-width="0.8"/>
                        </svg>
                        <span>Character</span>
                    </div>
                    <div class="panel-body">
                        <div class="char-name">— Awaiting name —</div>
                        <div class="char-meta">Sentinel · Lv. 1</div>
                    </div>
                </div>

                <div class="panel stats-panel">
                    <div class="panel-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2 L4 6 L4 12 C4 17, 8 21, 12 22 C16 21, 20 17, 20 12 L20 6 Z" fill="none" stroke="#d9c074" stroke-width="1.4"/>
                            <path d="M12 8 L12 16 M9 12 L15 12" stroke="#d9c074" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                        <span>Stats</span>
                    </div>
                    <div class="panel-body">
                        <div class="stat">
                            <div class="stat-label"><span>Health</span><span class="stat-val">100 / 100</span></div>
                            <div class="bar bar-hp"><div class="bar-fill" style="width: 100%"></div></div>
                        </div>
                        <div class="stat">
                            <div class="stat-label"><span>Mana</span><span class="stat-val">80 / 80</span></div>
                            <div class="bar bar-mana"><div class="bar-fill" style="width: 100%"></div></div>
                        </div>
                        <div class="stat">
                            <div class="stat-label"><span>Experience</span><span class="stat-val">0 / 100</span></div>
                            <div class="bar bar-xp"><div class="bar-fill" style="width: 0%"></div></div>
                        </div>
                    </div>
                </div>

                <div class="panel location-panel">
                    <div class="panel-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2 C7 2, 3 6, 3 11 C3 17, 12 22, 12 22 C12 22, 21 17, 21 11 C21 6, 17 2, 12 2 Z" fill="none" stroke="#d9c074" stroke-width="1.4"/>
                            <circle cx="12" cy="11" r="3" fill="none" stroke="#d9c074" stroke-width="1.4"/>
                        </svg>
                        <span>Location</span>
                    </div>
                    <div class="panel-body">
                        <div class="loc-name">Unknown</div>
                        <div class="loc-hint">Use <code>look</code> to observe</div>
                    </div>
                </div>
            </aside>

            <!-- ===== Main chat area ===== -->
            <main class="chat-area">
                <div class="chat-frame">
                    <div class="frame-corner tl"></div>
                    <div class="frame-corner tr"></div>
                    <div class="frame-corner bl"></div>
                    <div class="frame-corner br"></div>
                    <div id="messages" class="messages"></div>
                </div>
            </main>
        </div>

        <!-- ===== Input bar ===== -->
        <div class="input-area">
            <div class="input-ornament left"></div>
            <input id="input" type="text" placeholder="Speak, ranger…  (or use a command)" autocomplete="off">
            <button id="sendBtn" disabled>
                <span>Send</span>
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 12 L21 12 M14 5 L21 12 L14 19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="input-ornament right"></div>
        </div>
    </div>

    <script>
        // ===== References =====
        const statusEl = document.getElementById("status");
        const statusText = statusEl.querySelector(".status-text");
        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("sendBtn");

        // ===== Helper: add a message to the chat =====
        function addMessage(text, type = "") {
            const div = document.createElement("div");
            div.className = "message" + (type ? " " + type : "");
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ===== WebSocket connection =====
        const ws = new WebSocket("ws://localhost:8765");

        ws.onopen = () => {
            statusText.textContent = "Connected";
            statusEl.className = "status connected";
            sendBtn.disabled = false;
            inputEl.focus();
            addMessage("✦ The boughs whisper your arrival ✦", "system");
        };

        ws.onmessage = (event) => {
            addMessage(event.data);
        };

        ws.onclose = () => {
            statusText.textContent = "Disconnected";
            statusEl.className = "status disconnected";
            sendBtn.disabled = true;
            addMessage("✦ The connection to Teldrassil fades ✦", "system");
        };

        ws.onerror = () => {
            addMessage("✦ The ancient wards reject the link — is the server alight? ✦", "system");
        };

        // ===== Send a message =====
        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            if (ws.readyState !== WebSocket.OPEN) return;

            ws.send(text);
            addMessage("» " + text, "self");
            inputEl.value = "";
        }

        sendBtn.addEventListener("click", sendMessage);
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
